spring.application.name=BloodApp
server.port=8094

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matching}
spring.datasource.username=${DB_USERNAME:bloodapp}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Keycloak access tokens (docs/auth.md). The issuer is the public Keycloak URL; keys are fetched internally.
bloodapp.auth.issuer=${AUTH_ISSUER:http://localhost:8080/realms/bloodapp}
bloodapp.auth.jwks-uri=${AUTH_JWKS_URI:http://localhost:8080/realms/bloodapp/protocol/openid-connect/certs}
bloodapp.auth.audience=${AUTH_AUDIENCE:bloodapp-api}

# Only health and metrics are exposed; other actuator endpoints reveal configuration and internals.
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=never
