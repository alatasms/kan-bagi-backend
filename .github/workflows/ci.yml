name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build, test, vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore BloodApp.sln
      # The solution builds without warnings; keep it that way.
      - run: dotnet build BloodApp.sln --no-restore -c Release -warnaserror
      - run: dotnet test BloodApp.sln --no-build -c Release
      - name: Fail on known-vulnerable packages
        run: |
          dotnet list BloodApp.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q '>' vulnerable.txt

  notification-service:
    name: notification-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  chat-service:
    name: chat-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  matching-service:
    name: matching-service build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q package

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [dotnet, notification-service]
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: ./smoke-test.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
